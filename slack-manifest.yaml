_metadata:
  major_version: 2
display_information:
  name: Moss
features:
  bot_user:
    display_name: Moss
    always_online: true
  agent_view:
    agent_description: Agent Moss, a helper
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - files:read
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  socket_mode_enabled: true
