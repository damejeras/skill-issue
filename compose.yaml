services:
  bot:
    image: ghcr.io/damejeras/skill-issue:latest
    restart: unless-stopped
    environment:
      # Bot User OAuth Token, from "OAuth & Permissions" after you install the app.
      SLACK_BOT_TOKEN: xoxb-
      # App-level token with the connections:write scope, from "Basic Information".
      SLACK_APP_TOKEN: xapp-
      # To bill an API key instead of a Claude subscription, set it here.
      # From https://platform.claude.com/settings/keys
      # ANTHROPIC_API_KEY: sk-ant-
    volumes:
      - claude-home:/claude-home
      # To give Claude a project, mount it at /workspace:
      # - /path/to/project:/workspace:ro
    # Bubblewrap needs both to sandbox Bash: seccomp=unconfined lets it create user namespaces,
    # and systempaths=unconfined removes the masks on /proc that stop it from mounting a fresh /proc.
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined

volumes:
  claude-home:
